<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Renard</title>
    <link rel="stylesheet" href="../options/options.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="../shared/constants.js"></script>
    <script src="../content/sprite.js"></script>
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup-head">
        <canvas id="fox" width="32" height="32" aria-hidden="true"></canvas>
        <div>
          <h1>Renard</h1>
          <p class="popup-sub" id="status"></p>
        </div>
      </header>

      <ul class="popup-rows">
        <li class="row popup-row">
          <div class="row-text">
            <span class="row-title" id="spawn-label">Show Renard</span>
            <span class="hint">Everywhere it's turned on</span>
          </div>
          <label class="switch"
            ><input type="checkbox" role="switch" id="spawned" aria-labelledby="spawn-label" /><span class="switch-track"
              ><span class="switch-thumb"></span></span
          ></label>
        </li>
        <li class="row popup-row" id="site-row" hidden>
          <div class="row-text">
            <span class="row-title" id="site-label">On this site</span>
            <span class="hint popup-host" id="site-host"></span>
          </div>
          <label class="switch"
            ><input type="checkbox" role="switch" id="site-on" aria-labelledby="site-label" aria-describedby="site-host" /><span
              class="switch-track"
              ><span class="switch-thumb"></span></span
          ></label>
        </li>
      </ul>

      <p class="popup-note" id="note" role="status" hidden></p>

      <button class="btn btn-primary popup-settings" type="button" id="open-settings">Open settings</button>
    </main>
  </body>
</html>
